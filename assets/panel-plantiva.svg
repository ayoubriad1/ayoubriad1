<style>
  .bond{stroke:#7dd3fc;stroke-opacity:.5;stroke-width:2.6;stroke-linecap:round;fill:none}
  .flow{stroke:#fff;stroke-opacity:.9;stroke-width:2.6;stroke-linecap:round;fill:none;stroke-dasharray:4 70;animation:flow 3.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-74}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .float{animation:float 8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .in{opacity:0;animation:in .9s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hs{transform-box:fill-box;transform-origin:center;animation:hs 3.6s ease-in-out infinite}
  @keyframes hs{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1.05);opacity:.95}}
  .march{animation:march 1.2s linear infinite}
  @keyframes march{to{stroke-dashoffset:-10}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .grow{stroke-dasharray:260;stroke-dashoffset:260;animation:grow 8s ease-out infinite}
  @keyframes grow{0%{stroke-dashoffset:260;opacity:1}30%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  .leaf{transform-box:fill-box;transform-origin:center;animation:leaf 8s ease-out infinite}
  @keyframes leaf{0%,22%{transform:scale(0)}36%,90%{transform:scale(1)}100%{transform:scale(0)}}
  .bloom{transform-box:fill-box;transform-origin:center;animation:bloom 8s ease-out infinite}
  @keyframes bloom{0%,34%{transform:scale(0);opacity:0}44%,90%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
  .bub{animation:bub 2.6s ease-in infinite}
  @keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-80px);opacity:0}}
  .ul{transform-box:fill-box;transform-origin:0 50%;animation:ul 4s ease-in-out infinite}
  @keyframes ul{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.8)}}
</style>
