  <ellipse class="march" cx="330" cy="316" rx="96" ry="16" fill="none" stroke="#fb7185" stroke-opacity=".4" stroke-dasharray="5 5"/>
  <g transform="translate(160 -19.5) scale(1.7)"><g class="turn">
    <circle cx="100" cy="48" r="11" fill="#3b4a63"/><path d="M100 58V66" stroke="#3b4a63" stroke-width="7"/>
    <path d="M80 70L67 100L62 128" fill="none" stroke="#3b4a63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 70L133 100L138 128" fill="none" stroke="#3b4a63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M91 112L87 150L85 188" fill="none" stroke="#3b4a63" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M109 112L113 150L115 188" fill="none" stroke="#3b4a63" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M77 66Q100 61 123 66L119 90Q116 104 113 114H87Q84 104 81 90Z" fill="#3b4a63" stroke="#3b4a63" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="79" cy="71" rx="7" ry="6" class="m" style="animation-delay:-0s" fill="#fb7185"/><ellipse cx="121" cy="71" rx="7" ry="6" class="m" style="animation-delay:-0s" fill="#fb7185"/><ellipse cx="91" cy="80" rx="8.5" ry="6" class="m" style="animation-delay:-0.5s" fill="#fb7185"/><ellipse cx="109" cy="80" rx="8.5" ry="6" class="m" style="animation-delay:-0.5s" fill="#fb7185"/><ellipse cx="71" cy="90" rx="4" ry="9" transform="rotate(22 71 90)" class="m" style="animation-delay:-1s" fill="#fb7185"/><ellipse cx="129" cy="90" rx="4" ry="9" transform="rotate(-22 129 90)" class="m" style="animation-delay:-1s" fill="#fb7185"/><rect x="94" y="89" width="5.5" height="6" rx="2" class="m" style="animation-delay:-1.5s" fill="#fb7185"/><rect x="100.5" y="89" width="5.5" height="6" rx="2" class="m" style="animation-delay:-1.5s" fill="#fb7185"/><rect x="94" y="97" width="5.5" height="6" rx="2" class="m" style="animation-delay:-1.5s" fill="#fb7185"/><rect x="100.5" y="97" width="5.5" height="6" rx="2" class="m" style="animation-delay:-1.5s" fill="#fb7185"/><ellipse cx="85" cy="100" rx="2.5" ry="7" class="m" style="animation-delay:-2s" fill="#fb7185"/><ellipse cx="115" cy="100" rx="2.5" ry="7" class="m" style="animation-delay:-2s" fill="#fb7185"/><ellipse cx="89" cy="132" rx="5.5" ry="14" transform="rotate(4 89 132)" class="m" style="animation-delay:-2.5s" fill="#fb7185"/><ellipse cx="111" cy="132" rx="5.5" ry="14" transform="rotate(-4 111 132)" class="m" style="animation-delay:-2.5s" fill="#fb7185"/><ellipse cx="86" cy="168" rx="3.5" ry="9" class="m" style="animation-delay:-3s" fill="#fb7185"/><ellipse cx="114" cy="168" rx="3.5" ry="9" class="m" style="animation-delay:-3s" fill="#fb7185"/>
  </g></g>
  <g transform="translate(160 -19.5) scale(1.7)"><g class="tgt"><ellipse cx="71" cy="90" rx="4.6" ry="9.6" transform="rotate(22 71 90)" fill="#fb7185" filter="url(#glow)"/></g></g>
  <circle class="rip" cx="281" cy="134" r="8" fill="none" stroke="#fb7185" stroke-width="2"/>
  <g class="pop">
    <path d="M292 132L428 112" stroke="#fb7185" stroke-opacity=".6" stroke-dasharray="4 4"/>
    <rect x="428" y="66" width="206" height="136" rx="14" fill="#0b1220" fill-opacity=".96" stroke="#fb7185" stroke-opacity=".6"/>
    <text x="446" y="98" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Biceps brachii</text>
    <text x="446" y="120" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" fill="#94a3b8">upper arm · elbow flexor</text>
    <rect x="446" y="134" width="40" height="22" rx="11" fill="#fb7185" fill-opacity=".15" stroke="#fb7185" stroke-opacity=".6"/><text x="466" y="149" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#ffe4e6" text-anchor="middle">gym</text>
    <rect x="492" y="134" width="96" height="22" rx="11" fill="#fb7185" fill-opacity=".15" stroke="#fb7185" stroke-opacity=".6"/><text x="540" y="149" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#ffe4e6" text-anchor="middle">calisthenics</text>
    <text x="446" y="184" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" fill="#fb7185">→ exercises + guidance</text>
  </g>
  <g class="cur"><path d="M0 0L0 20L5.5 14.5L9.5 23L13 21.5L9 13.5L16 13.5Z" fill="#f8fafc" stroke="#0b1020" stroke-width="1.5" stroke-linejoin="round"/></g>
  <text x="636" y="336" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" fill="#475569" text-anchor="end">Z-Anatomy model · CC BY-SA 4.0</text>
  </g>
  <rect x=".5" y=".5" width="659" height="351" rx="18" fill="none" stroke="#fb7185" stroke-opacity=".22"/>
</g>
