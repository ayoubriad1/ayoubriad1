<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<title>Muscle Atlas</title>
<defs>
  <radialGradient id="aC" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#e0fbff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
  </radialGradient>
  <radialGradient id="aN" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#f1edff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/>
  </radialGradient>
  <radialGradient id="aO" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#ffe4f1"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#9d174d"/>
  </radialGradient>
  <radialGradient id="aS" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#fff7d6"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/>
  </radialGradient>
  <radialGradient id="aG" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#dcfce7"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090e21"/><stop offset="1" stop-color="#130f30"/></linearGradient>
  <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="400">
    <stop offset="0" stop-color="#fb7185"/><stop offset=".5" stop-color="#fb7185" stop-opacity=".06"/><stop offset="1" stop-color="#fb7185"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 600 200;360 600 200" dur="10s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bnr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0a0d22"/></linearGradient>
  <radialGradient id="bglow"><stop offset="0" stop-color="#fb7185" stop-opacity=".16"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94a3b8"/></pattern>
  <radialGradient id="heat"><stop offset="0" stop-color="#fef08a"/><stop offset=".35" stop-color="#fb923c"/><stop offset=".7" stop-color="#ef4444" stop-opacity=".6"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  <clipPath id="sc"><rect width="660" height="352" rx="18"/></clipPath></defs>
<style>
  .bond{stroke:#7dd3fc;stroke-opacity:.5;stroke-width:2.6;stroke-linecap:round;fill:none}
  .flow{stroke:#fff;stroke-opacity:.9;stroke-width:2.6;stroke-linecap:round;fill:none;stroke-dasharray:4 70;animation:flow 3.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-74}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .float{animation:float 8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .in{opacity:0;animation:in .9s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hs{transform-box:fill-box;transform-origin:center;animation:hs 3.6s ease-in-out infinite}
  @keyframes hs{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1.05);opacity:.95}}
  .march{animation:march 1.2s linear infinite}
  @keyframes march{to{stroke-dashoffset:-10}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .turn{transform-box:fill-box;transform-origin:center;animation:turn 10s ease-in-out infinite}
  @keyframes turn{0%{transform:scaleX(1)}12.5%{transform:scaleX(-1)}25%,100%{transform:scaleX(1)}}
  .m{animation:m 3.5s ease-in-out infinite}
  @keyframes m{0%,100%{fill-opacity:.22}45%{fill-opacity:.75}}
  .cur{animation:cur 10s ease-in-out infinite}
  @keyframes cur{0%,28%{transform:translate(560px,300px);opacity:0}32%{transform:translate(560px,300px);opacity:1}46%,84%{transform:translate(281px,134px);opacity:1}94%,100%{transform:translate(560px,300px);opacity:0}}
  .rip{transform-box:fill-box;transform-origin:center;opacity:0;animation:rip 10s ease-out infinite}
  @keyframes rip{0%,47%{transform:scale(.4);opacity:0}49%{transform:scale(1);opacity:1}60%,100%{transform:scale(3.2);opacity:0}}
  .tgt{opacity:0;animation:tgt 10s ease-in-out infinite}
  @keyframes tgt{0%,47%{opacity:0}50%,84%{opacity:1}90%,100%{opacity:0}}
  .pop{opacity:0;animation:pop 10s ease-out infinite}
  @keyframes pop{0%,49%{opacity:0;transform:translateY(8px)}54%,84%{opacity:1;transform:none}90%,100%{opacity:0}}
  .ul{transform-box:fill-box;transform-origin:0 50%;animation:ul 4s ease-in-out infinite}
  @keyframes ul{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.8)}}
</style>
<rect x="1" y="1" width="1198" height="398" rx="24" fill="url(#cbg)"/>
<g transform="translate(516 24)">
  <g clip-path="url(#sc)">
    <rect width="660" height="352" fill="url(#bnr)"/>
    <rect width="660" height="352" fill="url(#dots)" opacity=".1"/>
    <ellipse cx="330" cy="176" rx="330" ry="200" fill="url(#bglow)"/>
    
  <text x="24" y="38" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" fill="#64748b">// click a muscle → get exercises</text>
