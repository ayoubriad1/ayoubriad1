<text x="52" y="178" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#cbd5e1">Interactive 3D muscle atlas and exercise</text><text x="52" y="203" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#cbd5e1">finder: click any muscle on a rotatable body</text><text x="52" y="228" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#cbd5e1">to get exercises for your training style.</text>
