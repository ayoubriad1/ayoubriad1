<svg xmlns="http://www.w3.org/2000/svg" width="290" height="60" viewBox="0 0 290 60">
<title>Private for now</title>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <clipPath id="c"><rect x="1" y="1" width="288" height="58" rx="29"/></clipPath>
</defs>
<style>
  .sh{animation:sh 3.5s ease-in-out infinite}
  @keyframes sh{0%,55%{transform:translateX(-120px)}100%{transform:translateX(350px)}}
