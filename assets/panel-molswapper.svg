<style>
  .bond{stroke:#7dd3fc;stroke-opacity:.5;stroke-width:2.6;stroke-linecap:round;fill:none}
  .flow{stroke:#fff;stroke-opacity:.9;stroke-width:2.6;stroke-linecap:round;fill:none;stroke-dasharray:4 70;animation:flow 3.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-74}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .float{animation:float 8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .in{opacity:0;animation:in .9s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hs{transform-box:fill-box;transform-origin:center;animation:hs 3.6s ease-in-out infinite}
  @keyframes hs{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1.05);opacity:.95}}
  .march{animation:march 1.2s linear infinite}
  @keyframes march{to{stroke-dashoffset:-10}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .fx{animation:fx 7s ease-in-out infinite}
  @keyframes fx{0%,22%{transform:translate(0,0)}35%{transform:translate(65px,-49px)}48%,80%{transform:translate(130px,26px)}90%{transform:translate(65px,-49px)}100%{transform:translate(0,0)}}
  .fy{animation:fy 7s ease-in-out infinite}
  @keyframes fy{0%,22%{transform:translate(0,0)}35%{transform:translate(-65px,37px)}48%,80%{transform:translate(-130px,-26px)}90%{transform:translate(-65px,37px)}100%{transform:translate(0,0)}}
  .rot{transform-box:fill-box;transform-origin:center;animation:rot 7s ease-in-out infinite}
  @keyframes rot{0%,22%{transform:rotate(0deg)}48%,80%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
  .lk{animation:lk 7s linear infinite}
  @keyframes lk{0%,14%{opacity:1}18%,48%{opacity:0}52%,80%{opacity:1}83%,97%{opacity:0}100%{opacity:1}}
  .cut{opacity:0;animation:cut 7s linear infinite}
  @keyframes cut{0%,10%,22%,100%{opacity:0}13%,19%{opacity:1}}
  .halo{opacity:0;animation:halo 7s ease-in-out infinite}
  @keyframes halo{0%,48%,84%,100%{opacity:0}56%,78%{opacity:1}}
  .chip{animation:chip 7s ease-in-out infinite}
  @keyframes chip{0%,52%{opacity:.22}58%,80%{opacity:1}86%,100%{opacity:.22}}
  .arc{fill:none;stroke:#94a3b8;stroke-opacity:.3;stroke-width:1.4;stroke-dasharray:4 6;animation:march 1s linear infinite}
  .ul{transform-box:fill-box;transform-origin:0 50%;animation:ul 4s ease-in-out infinite}
  @keyframes ul{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.8)}}
</style>
