  <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="400">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".06"/><stop offset="1" stop-color="#22d3ee"/>
