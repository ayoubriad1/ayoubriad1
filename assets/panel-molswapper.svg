<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<title>MolSwapper</title>
<defs>
  <radialGradient id="aC" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#e0fbff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
  </radialGradient>
  <radialGradient id="aN" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#f1edff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/>
  </radialGradient>
  <radialGradient id="aO" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#ffe4f1"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#9d174d"/>
  </radialGradient>
  <radialGradient id="aS" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#fff7d6"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/>
