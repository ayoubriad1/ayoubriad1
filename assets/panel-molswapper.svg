<text x="52" y="178" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#cbd5e1">Modular Python/RDKit toolkit for de novo</text><text x="52" y="203" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#cbd5e1">chimeric drug design: fragment molecules,</text><text x="52" y="228" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="17.5" fill="#cbd5e1">recombine the pieces, keep the drug-like ones.</text>
