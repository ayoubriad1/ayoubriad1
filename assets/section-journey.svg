<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104">
<title>04 · Journey</title>
<defs>
  <radialGradient id="aC" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#e0fbff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
  </radialGradient>
  <radialGradient id="aN" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#f1edff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/>
  </radialGradient>
  <radialGradient id="aO" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#ffe4f1"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#9d174d"/>
  </radialGradient>
  <radialGradient id="aS" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#fff7d6"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/>
  </radialGradient>
  <radialGradient id="aG" cx=".35" cy=".3" r=".75">
    <stop offset="0" stop-color="#dcfce7"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#047857"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset=".6" stop-color="#a78bfa" stop-opacity=".2"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .bond{stroke:#7dd3fc;stroke-opacity:.5;stroke-width:2.6;stroke-linecap:round;fill:none}
  .flow{stroke:#fff;stroke-opacity:.9;stroke-width:2.6;stroke-linecap:round;fill:none;stroke-dasharray:4 70;animation:flow 3.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-74}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .float{animation:float 8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .in{opacity:0;animation:in .9s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hs{transform-box:fill-box;transform-origin:center;animation:hs 3.6s ease-in-out infinite}
  @keyframes hs{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1.05);opacity:.95}}
  .march{animation:march 1.2s linear infinite}
  @keyframes march{to{stroke-dashoffset:-10}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g transform="translate(52 50)">
  <g class="spin" style="animation-duration:24s"><path d="M0 -44L38.11 -22L38.11 22L0 44L-38.11 22L-38.11 -22Z" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 6"/></g>
  <path d="M0 -33L28.58 -16.5L28.58 16.5L0 33L-28.58 16.5L-28.58 -16.5Z" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="2"/>
  <text y="7" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="20" font-weight="800" fill="#a78bfa" text-anchor="middle">04</text>
</g>
<g class="in"><text x="112" y="54" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="url(#tg)">Journey</text></g>
<g class="in" style="animation-delay:.2s"><text x="114" y="82" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="17" fill="#94a3b8">// from math to molecules</text></g>
<rect x="112" y="97" width="1080" height="2" fill="url(#ln)"/>
<circle r="3.5" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M112 98H1100"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.7;1" dur="6s" repeatCount="indefinite"/></circle>
<g transform="translate(1150 46)" opacity=".75"><g class="spin"><line class="bond" x1="-1.7" y1="-15.06" x2="13.89" y2="-6.06"/><line class="bond" x1="1.7" y1="-20.94" x2="17.29" y2="-11.94"/><line class="flow" style="animation-delay:-0s" x1="0" y1="-18" x2="15.59" y2="-9"/><line class="bond" x1="15.59" y1="-9" x2="15.59" y2="9"/><line class="bond" x1="13.89" y1="6.06" x2="-1.7" y2="15.06"/><line class="bond" x1="17.29" y1="11.94" x2="1.7" y2="20.94"/><line class="bond" x1="0" y1="18" x2="-15.59" y2="9"/><line class="flow" style="animation-delay:-2.1s" x1="0" y1="18" x2="-15.59" y2="9"/><line class="bond" x1="-12.19" y1="9" x2="-12.19" y2="-9"/><line class="bond" x1="-18.99" y1="9" x2="-18.99" y2="-9"/><line class="bond" x1="-15.59" y1="-9" x2="0" y2="-18"/><g class="pulse" style="animation-delay:-0s"><circle cx="0" cy="-18" r="6.5" fill="url(#aC)"/></g><g class="pulse" style="animation-delay:-0.45s"><circle cx="15.59" cy="-9" r="6.5" fill="url(#aC)"/></g><g class="pulse" style="animation-delay:-0.9s"><circle cx="15.59" cy="9" r="6.5" fill="url(#aC)"/></g><g class="pulse" style="animation-delay:-1.35s"><circle cx="0" cy="18" r="6.5" fill="url(#aC)"/></g><g class="pulse" style="animation-delay:-1.8s"><circle cx="-15.59" cy="9" r="6.5" fill="url(#aC)"/></g><g class="pulse" style="animation-delay:-2.25s"><circle cx="-15.59" cy="-9" r="6.5" fill="url(#aC)"/></g></g></g>
</svg>
